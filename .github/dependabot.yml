version: 2
updates:
  # Keeps the SHA-pinned actions current: Dependabot rewrites the SHA and the
  # version comment together, so pinning does not freeze security fixes out.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
