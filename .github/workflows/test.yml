name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gating, not advisory. `eslint .` exits non-zero only on errors, so the
      # pre-existing `no-explicit-any` warnings do not fail the build.
      - name: Run linter
        run: npm run lint

      # Also runs the *.test-d.ts type assertions via vitest --typecheck.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Non-blocking early warning for the next TypeScript major. TypeScript 7 is
  # released but cannot be adopted yet: typescript-eslint peers
  # `typescript: >=4.8.4 <6.1.0`, so upgrading would break linting. This job
  # surfaces a TS-next regression in the shipped .d.ts before the switch
  # becomes possible, without gating the build.
  typescript-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsconfig.typecheck.json covers src plus the *.test-d.ts consumer-facing
      # type assertions, so a TS-next change to variance or inference shows up
      # here rather than in a consumer's project.
      - name: Typecheck against TypeScript next
        run: npx -y -p typescript@next tsc --noEmit -p tsconfig.typecheck.json
